<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="arrowRedRev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- ── Panel backgrounds ── -->
  <rect x="8"   y="8" width="484" height="434" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="508" y="8" width="484" height="434" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ── Panel titles ── -->
  <text x="250" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">Subagents</text>
  <text x="750" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">Teams</text>

  <!-- ══════════════════════════════════════════
       LEFT PANEL — Subagents
       ══════════════════════════════════════════ -->

  <!-- Orchestrator -->
  <rect x="170" y="58" width="160" height="48" rx="7" fill="#1E3A5F"/>
  <text x="250" y="87" text-anchor="middle" font-size="14" font-weight="600" fill="white">Orchestrator</text>

  <!-- Down arrows: instructions + scope (blue, solid) -->
  <line x1="212" y1="106" x2="92"  y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="250" y1="106" x2="250" y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="288" y1="106" x2="408" y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Label -->
  <text x="322" y="183" font-size="10" fill="#3B82F6" transform="rotate(14,322,183)">instructions + scope</text>

  <!-- Up arrows: results (green, dashed) -->
  <line x1="82"  y1="282" x2="220" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="262" y1="282" x2="262" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="418" y1="282" x2="278" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <!-- Label -->
  <text x="100" y="190" font-size="10" fill="#10B981">results</text>

  <!-- Context window A -->
  <rect x="32"  y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="87"  y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="47"  y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="87"  y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker A</text>

  <!-- Context window B -->
  <rect x="195" y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="250" y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="210" y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="250" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker B</text>

  <!-- Context window C -->
  <rect x="358" y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="413" y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="373" y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="413" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker C</text>

  <!-- No-communication note -->
  <text x="250" y="408" text-anchor="middle" font-size="11" fill="#94A3B8" font-style="italic">workers cannot see each other</text>

  <!-- ══════════════════════════════════════════
       RIGHT PANEL — Teams
       ══════════════════════════════════════════ -->

  <!-- Orchestrator -->
  <rect x="670" y="58" width="160" height="48" rx="7" fill="#1E3A5F"/>
  <text x="750" y="87" text-anchor="middle" font-size="14" font-weight="600" fill="white">Orchestrator</text>

  <!-- Down arrows: instructions + scope (blue, solid) -->
  <line x1="712" y1="106" x2="592" y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="106" x2="750" y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="788" y1="106" x2="908" y2="282" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Label -->
  <text x="822" y="183" font-size="10" fill="#3B82F6" transform="rotate(14,822,183)">instructions + scope</text>

  <!-- Up arrows: results (green, dashed) -->
  <line x1="582" y1="282" x2="720" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="762" y1="282" x2="762" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="918" y1="282" x2="778" y2="108" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <!-- Label -->
  <text x="600" y="190" font-size="10" fill="#10B981">results</text>

  <!-- Context window A -->
  <rect x="532" y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="587" y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="547" y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="587" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker A</text>

  <!-- Context window B -->
  <rect x="695" y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="750" y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="710" y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="750" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker B</text>

  <!-- Context window C -->
  <rect x="858" y="282" width="110" height="90" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="913" y="298" text-anchor="middle" font-size="9" fill="#64748B">context window</text>
  <rect x="873" y="302" width="80" height="36" rx="5" fill="#2563EB"/>
  <text x="913" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="white">Worker C</text>

  <!-- Direct message arrows between workers (red, dashed, bidirectional) -->
  <line x1="644" y1="322" x2="693" y2="322"
        stroke="#EF4444" stroke-width="2" stroke-dasharray="4,2"
        marker-start="url(#arrowRedRev)" marker-end="url(#arrowRed)"/>
  <line x1="807" y1="322" x2="856" y2="322"
        stroke="#EF4444" stroke-width="2" stroke-dasharray="4,2"
        marker-start="url(#arrowRedRev)" marker-end="url(#arrowRed)"/>

  <!-- Direct messages note -->
  <text x="750" y="398" text-anchor="middle" font-size="11" fill="#EF4444" font-style="italic">direct messages between workers</text>
  <text x="750" y="414" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">(teams only)</text>

  <!-- ── Legend ── -->
  <line x1="180" y1="432" x2="200" y2="432" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="205" y="436" font-size="10" fill="#3B82F6">instructions + scope</text>
  <line x1="330" y1="432" x2="350" y2="432" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="355" y="436" font-size="10" fill="#10B981">results</text>

</svg>
