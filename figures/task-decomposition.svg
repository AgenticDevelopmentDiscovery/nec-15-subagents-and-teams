<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#3B82F6"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#10B981"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Complex task -->
  <rect x="260" y="16" width="340" height="54" rx="8" fill="#1E3A5F"/>
  <text x="430" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="white">Complex Task</text>

  <!-- Arrow down -->
  <line x1="430" y1="70" x2="430" y2="96" stroke="#64748B" stroke-width="2.5" marker-end="url(#ad)"/>

  <!-- Orchestrator -->
  <rect x="270" y="96" width="320" height="54" rx="8" fill="#374151"/>
  <text x="430" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="white">Orchestrator</text>
  <text x="430" y="143" text-anchor="middle" font-size="11" fill="#9CA3AF">decomposes → delegates</text>

  <!-- Fan-out arrows -->
  <line x1="370" y1="150" x2="155" y2="192" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="430" y1="150" x2="430" y2="192" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="490" y1="150" x2="705" y2="192" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Parallel label -->
  <text x="430" y="178" text-anchor="middle" font-size="11" fill="#3B82F6" font-style="italic">run in parallel</text>

  <!-- Worker A — x=45, width=220, center=155 -->
  <rect x="45"  y="192" width="220" height="68" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="155" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Security</text>
  <text x="155" y="242" text-anchor="middle" font-size="11" fill="#64748B">own context window</text>

  <!-- Worker B — x=320, width=220, center=430 -->
  <rect x="320" y="192" width="220" height="68" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="430" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Performance</text>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#64748B">own context window</text>

  <!-- Worker C — x=595, width=220, center=705 -->
  <rect x="595" y="192" width="220" height="68" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="705" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Coverage</text>
  <text x="705" y="242" text-anchor="middle" font-size="11" fill="#64748B">own context window</text>

  <!-- Converge arrows -->
  <line x1="163" y1="260" x2="395" y2="296" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ag)"/>
  <line x1="430" y1="260" x2="430" y2="296" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ag)"/>
  <line x1="697" y1="260" x2="465" y2="296" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ag)"/>

  <!-- Result bar -->
  <rect x="240" y="296" width="380" height="32" rx="7" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="430" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Orchestrator synthesizes → final result</text>

</svg>
