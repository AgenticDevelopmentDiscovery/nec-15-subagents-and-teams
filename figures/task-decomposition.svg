<svg viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3B82F6"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#10B981"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Complex task input -->
  <rect x="330" y="10" width="200" height="36" rx="6" fill="#1E3A5F"/>
  <text x="430" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="white">Complex Task</text>

  <!-- Arrow down to orchestrator -->
  <line x1="430" y1="46" x2="430" y2="66" stroke="#64748B" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Orchestrator -->
  <rect x="340" y="66" width="180" height="36" rx="6" fill="#374151"/>
  <text x="430" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="white">Orchestrator</text>
  <text x="430" y="101" text-anchor="middle" font-size="9" fill="#9CA3AF">decomposes → delegates</text>

  <!-- Fan-out arrows to workers -->
  <line x1="370" y1="102" x2="160" y2="132" stroke="#3B82F6" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="430" y1="102" x2="430" y2="132" stroke="#3B82F6" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="490" y1="102" x2="700" y2="132" stroke="#3B82F6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Worker A -->
  <rect x="80"  y="132" width="160" height="36" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Security</text>
  <text x="160" y="163" text-anchor="middle" font-size="9" fill="#64748B">own context</text>

  <!-- Worker B -->
  <rect x="340" y="132" width="180" height="36" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="430" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Performance</text>
  <text x="430" y="163" text-anchor="middle" font-size="9" fill="#64748B">own context</text>

  <!-- Worker C -->
  <rect x="620" y="132" width="160" height="36" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="700" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Coverage</text>
  <text x="700" y="163" text-anchor="middle" font-size="9" fill="#64748B">own context</text>

  <!-- Parallel indicator -->
  <text x="430" y="123" text-anchor="middle" font-size="9" fill="#3B82F6" font-style="italic">run in parallel</text>

  <!-- Converge arrows back -->
  <line x1="168" y1="168" x2="390" y2="188" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ag)"/>
  <line x1="430" y1="168" x2="430" y2="188" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ag)"/>
  <line x1="692" y1="168" x2="470" y2="188" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ag)"/>

  <!-- Synthesized result -->
  <rect x="300" y="186" width="260" height="10" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="430" y="195" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Orchestrator synthesizes → result</text>

</svg>
