<svg viewBox="0 0 920 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#EF4444"/>
    </marker>
    <marker id="agr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#10B981"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- ── LEFT PANEL ── -->
  <rect x="8" y="8" width="420" height="204" rx="10" fill="#FFF5F5" stroke="#FECACA" stroke-width="1.5"/>
  <text x="218" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">❌  Single Agent</text>

  <!-- Three inputs -->
  <rect x="22"  y="44" width="86" height="26" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="65"  y="61" text-anchor="middle" font-size="11" fill="#7F1D1D">Security</text>
  <rect x="22"  y="88" width="86" height="26" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="65"  y="105" text-anchor="middle" font-size="11" fill="#7F1D1D">Performance</text>
  <rect x="22" y="132" width="86" height="26" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="65" y="149" text-anchor="middle" font-size="11" fill="#7F1D1D">Coverage</text>

  <line x1="110" y1="57"  x2="156" y2="90"  stroke="#FCA5A5" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="110" y1="101" x2="156" y2="104" stroke="#FCA5A5" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="110" y1="145" x2="156" y2="118" stroke="#FCA5A5" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Single agent -->
  <rect x="156" y="70" width="140" height="84" rx="8" fill="white" stroke="#FECACA" stroke-width="2"/>
  <text x="226" y="90"  text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Single Agent</text>
  <rect x="170" y="96" width="112" height="14" rx="3" fill="#E2E8F0"/>
  <rect x="170" y="96" width="106" height="14" rx="3" fill="#EF4444"/>
  <text x="226" y="107" text-anchor="middle" font-size="9" font-weight="700" fill="white">95% full</text>
  <text x="226" y="128" text-anchor="middle" font-size="10" fill="#EF4444" font-weight="600">findings dropped</text>
  <text x="226" y="144" text-anchor="middle" font-size="9" fill="#94A3B8">one pass only</text>

  <!-- Output -->
  <line x1="298" y1="112" x2="332" y2="112" stroke="#FCA5A5" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="332" y="84" width="82" height="56" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="373" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Partial</text>
  <text x="373" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Report</text>

  <text x="218" y="194" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">earlier findings lost from memory</text>

  <!-- ── RIGHT PANEL ── -->
  <rect x="492" y="8" width="420" height="204" rx="10" fill="#F0FDF4" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="702" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">✓  Three Subagents</text>

  <!-- Orchestrator -->
  <rect x="627" y="40" width="150" height="34" rx="6" fill="#1E3A5F"/>
  <text x="702" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="white">Orchestrator</text>

  <!-- Fan down -->
  <line x1="657" y1="74" x2="570" y2="100" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="702" y1="74" x2="702" y2="100" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="747" y1="74" x2="834" y2="100" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Three agents -->
  <rect x="508" y="100" width="124" height="72" rx="7" fill="white" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="570" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Security</text>
  <rect x="520" y="122" width="100" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="520" y="122" width="30"  height="10" rx="3" fill="#10B981"/>
  <text x="570" y="158" text-anchor="middle" font-size="10" fill="#059669">focused ✓</text>

  <rect x="640" y="100" width="124" height="72" rx="7" fill="white" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="702" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Performance</text>
  <rect x="652" y="122" width="100" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="652" y="122" width="30"  height="10" rx="3" fill="#10B981"/>
  <text x="702" y="158" text-anchor="middle" font-size="10" fill="#059669">focused ✓</text>

  <rect x="772" y="100" width="124" height="72" rx="7" fill="white" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="834" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Coverage</text>
  <rect x="784" y="122" width="100" height="10" rx="3" fill="#E2E8F0"/>
  <rect x="784" y="122" width="30"  height="10" rx="3" fill="#10B981"/>
  <text x="834" y="158" text-anchor="middle" font-size="10" fill="#059669">focused ✓</text>

  <!-- Results up -->
  <line x1="564" y1="100" x2="658" y2="76" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#agr)"/>
  <line x1="710" y1="100" x2="710" y2="76" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#agr)"/>
  <line x1="840" y1="100" x2="746" y2="76" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#agr)"/>

  <!-- Complete report -->
  <line x1="702" y1="178" x2="702" y2="188" stroke="#10B981" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="592" y="188" width="220" height="16" rx="5" fill="white" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="702" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">Complete Report — all findings ✓</text>

</svg>
