<svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748B"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Tasks queuing -->
  <rect x="20"  y="30"  width="100" height="30" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="70"  y="50"  text-anchor="middle" font-size="12" fill="#1E40AF">Task A</text>
  <rect x="20"  y="76"  width="100" height="30" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="70"  y="96"  text-anchor="middle" font-size="12" fill="#1E40AF">Task B</text>
  <rect x="20"  y="122" width="100" height="30" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="70"  y="142" text-anchor="middle" font-size="12" fill="#1E40AF">Task C</text>
  <rect x="20"  y="168" width="100" height="18" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" opacity="0.4"/>
  <text x="70"  y="181" text-anchor="middle" font-size="10" fill="#93C5FD">Task D…</text>

  <!-- Arrows in -->
  <line x1="122" y1="45"  x2="200" y2="78"  stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="122" y1="91"  x2="200" y2="95"  stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="122" y1="137" x2="200" y2="112" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Agent box -->
  <rect x="200" y="50" width="200" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="300" y="74"  text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Single Agent</text>
  <text x="300" y="92"  text-anchor="middle" font-size="9"  fill="#94A3B8" letter-spacing="1">CONTEXT WINDOW</text>
  <!-- Bar -->
  <rect x="218" y="97" width="164" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="218" y="97" width="152" height="18" rx="4" fill="#EF4444"/>
  <text x="300" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="white">92% full</text>
  <!-- Serial label -->
  <text x="300" y="136" text-anchor="middle" font-size="10" fill="#64748B">serial — one task at a time</text>

  <!-- Drop label -->
  <text x="300" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#EF4444">↓ earlier findings dropped</text>

  <!-- Arrow out -->
  <line x1="402" y1="100" x2="460" y2="100" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Incomplete report -->
  <rect x="460" y="58" width="160" height="84" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="540" y="88"  text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">Incomplete</text>
  <text x="540" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">Report</text>
  <text x="540" y="128" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">looks complete — isn't</text>

  <!-- Context window explanation boxes (right side) -->
  <rect x="660" y="30"  width="220" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="770" y="51"  text-anchor="middle" font-size="11" fill="#475569">📦 Context window fills up</text>
  <rect x="660" y="80"  width="220" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="770" y="101" text-anchor="middle" font-size="11" fill="#475569">⚡ Attention degrades</text>
  <rect x="660" y="130" width="220" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="770" y="151" text-anchor="middle" font-size="11" fill="#475569">🔁 Serial execution only</text>

</svg>
